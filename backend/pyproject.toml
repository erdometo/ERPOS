[project]
name = "erpos-backend"
version = "1.0.0"
description = "Cognitive Kernel backend for OmniGate ERP OS"
authors = [
    { name = "Erdem Metin", email = "erdem2001metin@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "sqlparse>=0.4.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pika>=1.3.0",
    "neo4j>=5.0.0",
    "qdrant-client>=1.7.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0"
]

[project.scripts]
api = "main:start"
worker = "worker:main"
seed = "seed_enterprise_data:seed_enterprise"
scrape = "scrape_and_seed_knowledge:main"
test-api = "test_api:run_checks"
test-saga = "test_saga_rbac:test_rbac_clearance"
console = "manual_test_console:main_menu"

[tool.poetry]
packages = [
    { include = "core" },
    { include = "storage" },
    { include = "cognitive" }
]

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ─── Linting and Formatting Tool Configs ───────────────────────────────────── Centralises Black, Ruff, and isort configuration so the CLI and IDE
# Centralises Black, Ruff, and isort configuration so the CLI and IDE
# extension both use identical settings.

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  ".git",
  "__pycache__",
  "venv",
  ".venv",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line too long (handled by Black)
  "B008",  # do not perform function calls in default args (FastAPI uses Depends)
  "N803",  # argument name should be lowercase (LangChain base classes use PascalCase)
  "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
force-sort-within-sections = true

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["backend"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv/", "__pycache__/"]
